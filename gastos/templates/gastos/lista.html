<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Meus gastos</h1>
    <ul>
        {% for gasto in gastos %}
            <a href="{% url 'editar_gasto' gasto.id %}"><li>{{gasto.descricao}}</li></a>
            <form action="{% url 'excluir_gasto' gasto.id %}" method="POST">
                {% csrf_token %} 
                <button>Excluir</button>
            </form>
        {% endfor %}
    </ul>
    <form action="{% url 'logout' %}" method="POST">
        {% csrf_token %}
        <button type="submit">Sair</button>
    </form>
</body>
</html>
